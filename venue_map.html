<head>
<meta charset="utf-8">

<title>タンゴ会場マップ</title>

<meta name="robots" content="noindex, nofollow">
<meta name="description" content="世界のアルゼンチンタンゴのミロンガ・ライブ会場マップ（fantango DB 2007–2017 と 2026年10月の情報サイトより）">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --ink:#1f1b16; --muted:#6b645b; --line:#e3ded6;
  --accent:#b3261e; --milonga:#b3261e; --live:#1d5fa8; --other:#7a6f62; --site:#0f7b6c; --bar:#b3261e;
  --chip:#f0ece6; --chip-on:#1f1b16; --chip-on-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --panel:#201c17; --ink:#efe9e1; --muted:#a59d92; --line:#352f28;
    --accent:#ef6b5f; --milonga:#ef6b5f; --live:#6aa6ec; --other:#a59d92; --site:#3cc4ae; --bar:#ef6b5f;
    --chip:#2b2620; --chip-on:#efe9e1; --chip-on-ink:#16130f;
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --panel:#201c17; --ink:#efe9e1; --muted:#a59d92; --line:#352f28;
  --accent:#ef6b5f; --milonga:#ef6b5f; --live:#6aa6ec; --other:#a59d92; --site:#3cc4ae; --bar:#ef6b5f;
  --chip:#2b2620; --chip-on:#efe9e1; --chip-on-ink:#16130f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;display:flex}
#side{width:360px;max-width:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);z-index:2}
#map{flex:1;min-width:0}
header{padding:16px 16px 8px}
h1{font-size:18px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px}
.controls{padding:8px 16px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.controls>*{min-width:0}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.yr{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
#tl{display:grid;gap:4px}
#tl .head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
.seg input{display:none}
.seg label:has(input:checked){background:var(--chip-on);color:var(--chip-on-ink)}
#csv{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;font:inherit;font-size:12px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.world-btn a{font-size:16px;line-height:30px;text-align:center;cursor:pointer}
#play{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;font:inherit;font-size:12px;padding:2px 10px;cursor:pointer}
#hist{display:block;width:100%;height:64px;cursor:pointer}
#hist rect.b{fill:var(--line)}
#hist rect.b.on{fill:var(--bar)}
#hist text{fill:var(--muted);font-size:9px}
#stats{font-size:12px;color:var(--muted)}
#stats b{color:var(--ink);font-variant-numeric:tabular-nums}
#inview{padding:6px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
#inview b{color:var(--ink);font-variant-numeric:tabular-nums}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
#list li:hover{background:var(--bg)}
#list .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .ct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;align-self:center;grid-row:span 2}
#list .ad{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaflet-popup-content{margin:12px 14px;font:13px/1.5 inherit;min-width:230px}
.pp h3{margin:0;font-size:15px}
.pp .en{color:#6b645b;font-size:12px}
.pp .meta{margin:6px 0;font-size:12px}
.pp a{color:#b3261e}
.pp svg{display:block;margin-top:6px}
.pp ul{margin:6px 0 0;padding-left:18px;max-height:220px;overflow:auto}
.pp .now{margin-top:8px;padding:6px 8px;border-radius:6px;background:#eef7f1;border:1px solid #cfe8d8}
.pp .now b.h{color:#1e7a46}
.pp li{margin:2px 0}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;color:#fff;margin-right:4px}
#toggle{display:none}
@media (max-width:760px){
  body{flex-direction:column}
  #side{width:100%;height:46%;border-right:0;border-bottom:1px solid var(--line);overflow:auto}
  #list{flex:none;overflow:visible}
  #map{height:54%}
}
</style>
</head>

function spark(v) {
  const ys = []; for (let y = 2007; y <= 2017; y++) ys.push(y);
  const vals = ys.map(y => v.y[y] || 0), mx = Math.max(1, ...vals);
  const w = 228, h = 44, bw = w / ys.length;
  const bars = vals.map((c, i) => c ? `<rect x="${(i*bw+1).toFixed(1)}" y="${(h-14-(h-16)*c/mx).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${((h-16)*c/mx).toFixed(1)}" fill="#b3261e"><title>${ys[i]}: ${c}件</title></rect>` : '').join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${h-13}" y2="${h-13}" stroke="#ccc"/>${bars}<text x="0" y="${h-2}" font-size="10" fill="#888">2007</text><text x="${w}" y="${h-2}" font-size="10" fill="#888" text-anchor="end">2017</text></svg>`;
}
function popup(v) {
  if (v.site) return `<div class="pp"><h3>${esc(v.c)}</h3><div class="en">${esc(v.country)}</div>
    <div class="meta">タンゴ団体・サイト <b>${v.sites.length}</b> 件（links テーブル。住所はなく都市単位の位置）</div>
    <ul>${v.sites.map(s => `<li>${s.u ? `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n || s.u)}</a>` : esc(s.n)}</li>`).join('')}</ul></div>`;
  const tagCols = {milonga:'#b3261e', live:'#1d5fa8'};
  const tags = v.g.map(t => `<span class="tag" style="background:${tagCols[t] || '#7a6f62'}">${esc(t)}</span>`).join('');
  const yrs = Object.keys(v.y);
  return `<div class="pp"><h3>${esc(v.j || v.t)}</h3>${v.j && v.t && v.j !== v.t ? `<div class="en">${esc(v.t)}</div>` : ''}
    <div class="meta">${tags}${esc(v.c)}<br>${esc(v.a)}${v.u ? `<br><a href="${esc(v.u)}" target="_blank" rel="noopener">Webサイト（当時）</a>` : ''}</div>
    ${v.n ? `<div class="meta">イベント <b>${v.n.toLocaleString()}</b> 件（${yrs[0]}–${yrs[yrs.length-1]}）</div>${spark(v)}` : v.now ? '' : '<div class="meta">カレンダーとの紐付けなし</div>'}${nowBox(v)}</div>`;
}
function nowBox(v) {
  const w = v.now; if (!w) return '';
  return `<div class="now"><b class="h">● ${esc(w.date.slice(0, 7).replace('-', '年'))}月 現在の情報</b>${w.matched ? '（以前からの会場・現在も開催）' : '（新規追加）'}` +
    (w.name && w.name !== (v.j || v.t) ? `<br>掲載名：${esc(w.name)}` : '') +
    (w.ev.length ? `<br>イベント：${esc(w.ev.slice(0, 5).join(' / '))}${w.ev.length > 5 ? ' …' : ''}` : '') +
    (w.links.length ? `<br>リンク：${w.links.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 32))}</a>`).join('、')}` : '') +
    `<br>出典：${w.src.map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a>`).join('、')}（${esc(w.date)} 確認）</div>`;
}

V.forEach(v => {
  v.k = tagOf(v);
  v.s = [v.t, v.j, v.a, v.c, ...(v.sites || []).flatMap(s => [s.n, s.u]), ...(v.now ? [v.now.name, ...v.now.ev] : [])].join(' ').toLowerCase();
  v.col = css(TAGS.find(t => t[0] === v.k)[2]);
  v.m = L.circleMarker([v.lat, v.lon], {radius: 8, weight: 2, color: '#fff', fillOpacity: .85, fillColor: v.col});
  v.m.bindPopup(() => popup(v), {maxWidth: 280});
});

const $ = id => document.getElementById(id);
function render() {
  let y0 = +$('y0').value, y1 = +$('y1').value;
  if (y0 > y1) [y0, y1] = [y1, y0];
  $('yr').textContent = `${y0}–${y1}`;
  const q = $('q').value.trim().toLowerCase(), evf = document.querySelector('input[name=evf]:checked').value;
  const full = y0 === 2007 && y1 === 2017;
  const hits = [];
  for (const v of V) {
    if (!on.has(v.k) || (q && !v.s.includes(q))) continue;
    let n = 0; for (const y in v.y) if (y >= y0 && y <= y1) n += v.y[y];
    if ((evf === 'with' && !n) || (evf === 'without' && v.n) || (evf === 'now' && !v.now)) continue;
    v.cur = n;
    // 期間内にイベントがない会場（海外の会場など）も消さずに薄く表示する
    if (v.site) v.m.setStyle({radius: 9 + Math.min(8, Math.sqrt(v.sites.length) * 1.5), fillColor: v.col, fillOpacity: .85, color: '#fff'});
    else if (n) v.m.setStyle({radius: 9 + Math.min(12, Math.sqrt(n) / 2), fillColor: v.col, fillOpacity: .85, color: '#fff'});
    else v.m.setStyle({radius: 8, fillColor: v.col, fillOpacity: full ? .7 : .3, color: full ? '#fff' : 'transparent'});
    hits.push(v);
  }
  current = hits;
  hits.sort((a, b) => !!a.site - !!b.site || b.cur - a.cur || (b.sites || []).length - (a.sites || []).length || (a.j || a.t).localeCompare(b.j || b.t, 'ja'));
  drawHist(y0, y1);
  cluster.clearLayers(); cluster.addLayers(hits.map(v => v.m));
  const ven = hits.filter(v => !v.site), st = hits.filter(v => v.site);
  const total = ven.reduce((s, v) => s + v.cur, 0), act = ven.filter(v => v.cur).length;
  const nowN = ven.filter(v => v.now).length;
  $('stats').innerHTML = `<b>${ven.length.toLocaleString()}</b> 会場（うち期間内にイベントあり <b>${act.toLocaleString()}</b>、2026年現在の情報あり <b>${nowN.toLocaleString()}</b>）／ イベント <b>${total.toLocaleString()}</b> 件` +
    (st.length ? `<br>タンゴ団体・サイト <b>${st.reduce((s, v) => s + v.sites.length, 0)}</b> 件（<b>${st.length}</b> 都市）` : '') +
    `<br>イベント数は fantango の国内カレンダー（2007–2017）。2026年の情報は各タンゴ情報サイトから`;
  renderList();
}
// 一覧は「地図に見えている範囲」の会場・サイトだけを出す（拡大・縮小・移動のたびに更新）

}

const YEARS = []; for (let y = 2007; y <= 2017; y++) YEARS.push(y);
const TOT = YEARS.map(y => V.reduce((s, v) => s + (v.y[y] || 0), 0));
function drawHist(y0, y1) {
  const W = 328, H = 64, bw = W / YEARS.length, mx = Math.max(...TOT);
  $('hist').innerHTML = YEARS.map((y, i) => {
    const h = (H - 14) * TOT[i] / mx;
    return `<rect class="b${y >= y0 && y <= y1 ? ' on' : ''}" data-y="${y}" x="${i*bw+1}" y="${H-12-h}" width="${bw-2}" height="${h}"><title>${y}年: ${TOT[i].toLocaleString()}件</title></rect>` +
      (i % 2 === 0 ? `<text x="${i*bw+bw/2}" y="${H-2}" text-anchor="middle">${String(y).slice(2)}</text>` : '');
  }).join('');

let timer = null;

  if (timer) return stop();
  let y = +$('y0').value === +$('y1').value && +$('y0').value < 2017 ? +$('y0').value + 1 : 2007;
  map.setView([36.5, 137.5], 5);
  const step = () => { $('y0').value = $('y1').value = y; render(); if (++y > 2017) stop(); };

};
render();
// 画面幅にかかわらず全会場（北米・南米〜オセアニア）が収まるように初期表示
fitWorld();
// 表示直後は地図の大きさが確定していないことがあるので、操作されるまではサイズ変化のたびに世界全体へ合わせ直す
let touched = false;
['mousedown', 'wheel', 'touchstart', 'keydown'].forEach(ev => $('map').addEventListener(ev, () => { touched = true; }, {passive: true}));
$('list').addEventListener('click', () => { touched = true; });
new ResizeObserver(() => { if (!touched && $('map').clientWidth > 0) fitWorld(); }).observe($('map'));
</script>
</body>
</html>
